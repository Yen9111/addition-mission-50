<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preschool Math Fun Quiz!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3e8ff; /* Pastel Purple */
            background-image: radial-gradient(#d8b4fe 3px, transparent 3px); /* Slightly darker purple dots */
            background-size: 40px 40px;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .comic-font {
            font-family: 'Comic Neue', cursive;
        }

        /* Fun Animations */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite ease-in-out;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        .animate-wiggle {
            animation: wiggle 2s infinite ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* Decorative Elements */
        .decoration {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
            animation: float 6s infinite ease-in-out;
        }

        .btn-choice {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-choice:hover:not(:disabled) {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        .btn-choice:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-choice.correct {
            background-color: #4ade80 !important; /* Green-400 */
            color: white;
            border-color: #22c55e;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
        }
        .btn-choice.wrong {
            background-color: #f87171 !important; /* Red-400 */
            color: white;
            border-color: #ef4444;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        /* Certificate Styles */
        #certificate-container {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .certificate-wrapper {
            position: relative;
            background: white;
            border: 20px solid #fde047; /* Yellow border */
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 L60 40 L90 40 L65 60 L75 90 L50 70 L25 90 L35 60 L10 40 L40 40 Z" fill="rgba(253, 224, 71, 0.1)"/></svg>');
        }
        .cert-ribbon {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            color: #ef4444;
        }
        
        @media print {
            body * {
                visibility: hidden;
            }
            #certificate-container, #certificate-container * {
                visibility: visible;
            }
            #certificate-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
            body {
                background: white;
            }
        }

        /* Progress Bar */
        .progress-bar-fill {
            transition: width 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Background Decorations -->
    <i class="fas fa-star decoration text-yellow-400 text-5xl" style="top: 10%; left: 5%; animation-delay: 0s;"></i>
    <i class="fas fa-moon decoration text-blue-300 text-6xl" style="top: 20%; right: 10%; animation-delay: 1s;"></i>
    <i class="fas fa-cloud decoration text-white text-7xl opacity-80" style="top: 50%; left: 15%; animation-delay: 2s;"></i>
    <i class="fas fa-apple-alt decoration text-red-400 text-5xl" style="bottom: 20%; right: 20%; animation-delay: 0.5s;"></i>
    <i class="fas fa-car decoration text-blue-500 text-6xl" style="bottom: 10%; left: 25%; animation-delay: 1.5s;"></i>
    <i class="fas fa-pencil-alt decoration text-yellow-500 text-4xl" style="top: 70%; right: 5%; animation-delay: 0.8s;"></i>

    <div class="container mx-auto px-4 py-8 max-w-3xl flex-grow flex flex-col justify-center relative z-10">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="bg-white rounded-3xl p-8 shadow-2xl text-center border-4 border-yellow-300 pop-in">
            <h1 class="text-4xl md:text-5xl font-bold text-blue-600 mb-4 animate-bounce-slow">
                <i class="fas fa-rocket mr-2 text-red-500"></i> Awesome Math Quiz!
            </h1>
            <p class="text-xl text-gray-600 mb-6 comic-font">Let's have fun adding numbers!</p>
            
            <div class="mb-6 flex justify-center">
                <!-- SVG Cartoon Owl -->
                <svg width="150" height="150" viewBox="0 0 100 100" class="animate-wiggle">
                    <circle cx="50" cy="50" r="45" fill="#8B5CF6"/>
                    <circle cx="50" cy="50" r="40" fill="#A78BFA"/>
                    <circle cx="35" cy="40" r="15" fill="white"/>
                    <circle cx="65" cy="40" r="15" fill="white"/>
                    <circle cx="35" cy="40" r="5" fill="#1F2937"/>
                    <circle cx="65" cy="40" r="5" fill="#1F2937"/>
                    <path d="M45 55 L55 55 L50 65 Z" fill="#F59E0B"/>
                    <path d="M30 70 Q50 85 70 70" fill="none" stroke="#1F2937" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <div class="max-w-md mx-auto">
                <label for="student-name" class="block text-lg font-bold mb-2 text-pink-500 comic-font">What is your name?</label>
                <input type="text" id="student-name" class="w-full px-4 py-3 rounded-xl border-4 border-pink-200 focus:border-pink-500 focus:outline-none text-xl text-center shadow-inner mb-6 font-bold text-gray-700" placeholder="Example: Alex or Mia">
                
                <button id="start-btn" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-white font-bold py-4 px-8 rounded-full text-2xl shadow-lg transform transition hover:scale-105 active:scale-95 comic-font border-4 border-yellow-200">
                    <i class="fas fa-play mr-2"></i> Start Playing!
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden bg-white rounded-3xl p-6 md:p-10 shadow-2xl border-4 border-blue-300 pop-in flex-col">
            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <div class="bg-blue-100 px-4 py-2 rounded-full font-bold text-blue-700 border-2 border-blue-200">
                    Question: <span id="question-number" class="text-xl">1</span> / 50
                </div>
                <div class="bg-yellow-100 px-4 py-2 rounded-full font-bold text-yellow-700 border-2 border-yellow-200 flex items-center">
                    <i class="fas fa-star text-yellow-500 mr-2 animate-pulse"></i> Score: <span id="score-display" class="text-xl ml-1">0</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-4 mb-8 border border-gray-300 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-blue-500 h-4 rounded-full progress-bar-fill w-0"></div>
            </div>

            <!-- Question Area -->
            <div class="text-center mb-10">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-600 comic-font mb-2">What is the total?</h2>
                <div id="equation-display" class="text-6xl md:text-8xl font-black text-indigo-600 my-6 flex justify-center items-center gap-4">
                    <span id="num1" class="drop-shadow-md">?</span> 
                    <span class="text-pink-500">+</span> 
                    <span id="num2" class="drop-shadow-md">?</span> 
                    <span class="text-pink-500">=</span> 
                    <span id="answer-box" class="inline-block border-b-8 border-dashed border-gray-400 w-24 md:w-32 h-20 md:h-24 text-gray-400">?</span>
                </div>
            </div>

            <!-- Visual Aids (Dots/Apples) -->
            <div id="visual-aid" class="flex justify-center items-center gap-8 mb-8 text-3xl">
                <!-- Javascript will populate this -->
            </div>

            <!-- Choices Area -->
            <div class="grid grid-cols-2 gap-6 max-w-lg mx-auto w-full">
                <button id="choice-1" class="btn-choice bg-white text-blue-600 font-bold py-6 px-4 rounded-2xl text-4xl shadow-[0_8px_0_#93c5fd] border-4 border-blue-200 cursor-pointer w-full text-center hover:bg-blue-50 active:translate-y-2 active:shadow-[0_0px_0_#93c5fd] transition-all">
                    A
                </button>
                <button id="choice-2" class="btn-choice bg-white text-purple-600 font-bold py-6 px-4 rounded-2xl text-4xl shadow-[0_8px_0_#d8b4fe] border-4 border-purple-200 cursor-pointer w-full text-center hover:bg-purple-50 active:translate-y-2 active:shadow-[0_0px_0_#d8b4fe] transition-all">
                    B
                </button>
            </div>

            <!-- Next Button (Hidden initially) -->
            <div class="mt-8 flex justify-center hidden" id="next-btn-container">
                <button id="next-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-[0_6px_0_#166534] active:translate-y-2 active:shadow-none transition-all comic-font">
                    Next <i class="fas fa-arrow-right ml-2"></i>
                </button>
            </div>
            
            <!-- Feedback Message -->
            <div id="feedback-message" class="text-center mt-6 h-12 text-2xl font-bold comic-font opacity-0 transition-opacity duration-300">
                <!-- Correct/Wrong text goes here -->
            </div>
        </div>

        <!-- Result / Certificate Screen -->
        <div id="certificate-container" class="pop-in">
            <div class="certificate-wrapper comic-font">
                <i class="fas fa-award cert-ribbon no-print"></i>
                
                <h1 class="text-5xl text-blue-700 font-bold mb-4 mt-6">CERTIFICATE OF ACHIEVEMENT</h1>
                <h2 class="text-2xl text-gray-600 mb-8">PRESCHOOL MATH QUIZ</h2>
                
                <p class="text-xl mb-4">This certificate is awarded to:</p>
                <div class="py-4 border-b-4 border-blue-400 mx-auto w-3/4 mb-8">
                    <span id="cert-name" class="text-4xl font-bold text-pink-600 uppercase tracking-wider">STUDENT NAME</span>
                </div>
                
                <p class="text-lg mb-6">For successfully completing the addition quiz with excellence!</p>
                
                <div class="bg-yellow-100 rounded-xl p-6 inline-block mx-auto border-4 border-yellow-300 shadow-lg mb-8">
                    <p class="text-xl font-bold text-gray-700 mb-2">Total Correct Score:</p>
                    <div class="text-6xl font-black text-green-600">
                        <span id="final-score">0</span><span class="text-3xl text-gray-500">/50</span>
                    </div>
                </div>

                <!-- Mascot on Certificate -->
                <div class="flex justify-center mb-4">
                    <i class="fas fa-graduation-cap text-6xl text-blue-500"></i>
                </div>

                <p class="text-md text-gray-500 mt-4 italic" id="cert-date"></p>

                <!-- Actions -->
                <div class="mt-8 no-print flex justify-center gap-4 flex-wrap">
                    <button onclick="window.print()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105">
                        <i class="fas fa-print mr-2"></i> Print Certificate
                    </button>
                    <button onclick="location.reload()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full shadow-lg transition transform hover:scale-105">
                        <i class="fas fa-redo mr-2"></i> Play Again
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Audio Elements (Using Web Audio API synthesis for reliable sound generation without external files) -->
    <script>
        // Audio Context setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Create a pleasant chime sound
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            
            // Simple melody for success
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); // C6
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // Create a "bloop" or gentle error sound
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            
            // Descending notes for fail
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playCheerSound() {
            // Simplified synth cheer using multiple oscillators
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            for(let i=0; i<5; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Random frequencies for a 'crowd' feel, though mostly noise
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(Math.random() * 400 + 400, audioCtx.currentTime);
                
                // Add some vibrato
                const lfo = audioCtx.createOscillator();
                lfo.frequency.value = 5 + Math.random() * 5;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 20;
                lfo.connect(lfoGain);
                lfoGain.connect(osc.frequency);
                lfo.start();
                lfo.stop(audioCtx.currentTime + 2);
                
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 2);
            }
            
            // Add a higher pitched "yay" melody overlay
            const oscYay = audioCtx.createOscillator();
            const gainYay = audioCtx.createGain();
            oscYay.type = 'sine';
            oscYay.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscYay.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.5);
            gainYay.gain.setValueAtTime(0, audioCtx.currentTime);
            gainYay.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.2);
            gainYay.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            oscYay.connect(gainYay);
            gainYay.connect(audioCtx.destination);
            oscYay.start();
            oscYay.stop(audioCtx.currentTime + 1);
        }
    </script>

    <script>
        // State Variables
        const TOTAL_QUESTIONS = 50;
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let studentName = "";
        let currentCorrectAnswer = 0;
        let isAnswered = false;

        // DOM Elements
        const screens = {
            welcome: document.getElementById('welcome-screen'),
            quiz: document.getElementById('quiz-screen'),
            certificate: document.getElementById('certificate-container')
        };
        
        const nameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        
        const ui = {
            qNum: document.getElementById('question-number'),
            score: document.getElementById('score-display'),
            progressBar: document.getElementById('progress-bar'),
            num1: document.getElementById('num1'),
            num2: document.getElementById('num2'),
            answerBox: document.getElementById('answer-box'),
            visualAid: document.getElementById('visual-aid'),
            btn1: document.getElementById('choice-1'),
            btn2: document.getElementById('choice-2'),
            nextBtnContainer: document.getElementById('next-btn-container'),
            nextBtn: document.getElementById('next-btn'),
            feedback: document.getElementById('feedback-message')
        };

        function generateQuestions() {
            const qList = [];
            // Preschool appropriate: mostly sums up to 10, some up to 20.
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                let n1, n2;
                if (i < 30) {
                    // Easier questions first (sums to 10)
                    n1 = Math.floor(Math.random() * 6); // 0 to 5
                    n2 = Math.floor(Math.random() * 6); // 0 to 5
                } else {
                    // Slightly harder (sums to 15)
                    n1 = Math.floor(Math.random() * 8) + 1; // 1 to 8
                    n2 = Math.floor(Math.random() * 8) + 1; // 1 to 8
                }
                
                const answer = n1 + n2;
                
                // Generate a plausible wrong answer (close to the real answer)
                let wrongAnswer;
                do {
                    const offset = Math.floor(Math.random() * 5) - 2; // -2, -1, 0, 1, 2
                    wrongAnswer = answer + offset;
                    // Ensure wrong answer is positive and not equal to real answer
                    if (wrongAnswer < 0) wrongAnswer = answer + 1;
                } while (wrongAnswer === answer);

                qList.push({ num1: n1, num2: n2, answer: answer, wrong: wrongAnswer });
            }
            return qList;
        }

        startBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (name === "") {
                // Shake input instead of alert
                nameInput.classList.add('animate-[shake_0.5s_ease-in-out]');
                nameInput.style.borderColor = '#ef4444';
                setTimeout(() => {
                    nameInput.classList.remove('animate-[shake_0.5s_ease-in-out]');
                    nameInput.style.borderColor = '';
                }, 500);
                nameInput.placeholder = "Please enter your name first!";
                return;
            }

            studentName = name;
            questions = generateQuestions();
            
            // Audio context requires user gesture to start in most browsers
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            screens.welcome.classList.add('hidden');
            screens.quiz.classList.remove('hidden');
            screens.quiz.classList.add('flex');
            
            loadQuestion();
        });

        function getIconHtml(count, colorClass, iconClass = 'fa-apple-alt') {
            if (count === 0) return '<span class="text-xl text-gray-400 font-normal ml-2">(Zero)</span>';
            let html = '';
            // Limit icons if too many to prevent layout breaking
            const displayCount = count > 10 ? 10 : count; 
            for (let i = 0; i < displayCount; i++) {
                html += `<i class="fas ${iconClass} ${colorClass} text-2xl mx-1 animate-bounce-slow" style="animation-delay: ${i*0.1}s"></i>`;
            }
            if(count > 10) html += `<span class="text-xl font-bold ${colorClass} ml-2">+${count-10}</span>`;
            return html;
        }

        function loadQuestion() {
            isAnswered = false;
            const q = questions[currentQuestionIndex];
            currentCorrectAnswer = q.answer;

            // Update Header & Progress
            ui.qNum.innerText = currentQuestionIndex + 1;
            ui.score.innerText = score;
            const progressPct = ((currentQuestionIndex) / TOTAL_QUESTIONS) * 100;
            ui.progressBar.style.width = `${progressPct}%`;

            // Update Equation
            ui.num1.innerText = q.num1;
            ui.num2.innerText = q.num2;
            ui.answerBox.innerText = "?";
            ui.answerBox.className = "inline-block border-b-8 border-dashed border-gray-400 w-24 md:w-32 h-20 md:h-24 text-gray-400"; // Reset style

            // Update Visual Aids
            ui.visualAid.innerHTML = `
                <div class="flex flex-wrap justify-center items-center">
                    ${getIconHtml(q.num1, 'text-red-500')}
                </div>
                <div class="mx-4 text-pink-300 font-bold">+</div>
                <div class="flex flex-wrap justify-center items-center">
                    ${getIconHtml(q.num2, 'text-green-500', 'fa-leaf')}
                </div>
            `;

            // Setup Choices randomly
            const choices = [q.answer, q.wrong];
            // Shuffle choices
            if (Math.random() > 0.5) {
                choices.reverse();
            }

            // Reset Buttons
            [ui.btn1, ui.btn2].forEach((btn, index) => {
                btn.innerText = choices[index];
                btn.className = "btn-choice bg-white text-blue-600 font-bold py-6 px-4 rounded-2xl text-4xl shadow-[0_8px_0_#93c5fd] border-4 border-blue-200 cursor-pointer w-full text-center hover:bg-blue-50 active:translate-y-2 active:shadow-[0_0px_0_#93c5fd] transition-all";
                btn.disabled = false;
                // Use custom data attribute to store value
                btn.dataset.value = choices[index];
            });

            // Reset Feedback & Next Button
            ui.feedback.style.opacity = "0";
            ui.nextBtnContainer.classList.add('hidden');
        }

        function checkAnswer(selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const selectedValue = parseInt(selectedBtn.dataset.value);
            const isCorrect = selectedValue === currentCorrectAnswer;

            // Disable both buttons
            ui.btn1.disabled = true;
            ui.btn2.disabled = true;

            ui.answerBox.innerText = currentCorrectAnswer;
            ui.answerBox.classList.remove('text-gray-400', 'border-gray-400', 'border-dashed');
            ui.answerBox.classList.add('border-solid');

            if (isCorrect) {
                playCorrectSound();
                score++;
                ui.score.innerText = score;
                selectedBtn.classList.add('correct');
                
                ui.answerBox.classList.add('text-green-500', 'border-green-500');
                
                ui.feedback.innerHTML = `<span class="text-green-500"><i class="fas fa-check-circle mr-2"></i>Great job! Correct Answer.</span>`;
                ui.feedback.style.opacity = "1";
                
                // Add pop animation to score
                ui.score.parentElement.classList.remove('pop-in');
                void ui.score.parentElement.offsetWidth; // trigger reflow
                ui.score.parentElement.classList.add('pop-in');

            } else {
                playWrongSound();
                selectedBtn.classList.add('wrong');
                
                // Highlight the correct answer box
                ui.answerBox.classList.add('text-red-500', 'border-red-500');
                
                // Find and highlight the correct button slightly
                if (parseInt(ui.btn1.dataset.value) === currentCorrectAnswer) {
                    ui.btn1.style.border = "4px solid #4ade80";
                } else {
                    ui.btn2.style.border = "4px solid #4ade80";
                }

                ui.feedback.innerHTML = `<span class="text-red-500"><i class="fas fa-times-circle mr-2"></i>Oops, not quite. Answer: ${currentCorrectAnswer}</span>`;
                ui.feedback.style.opacity = "1";
            }

            ui.nextBtnContainer.classList.remove('hidden');
            
            // Auto proceed for younger kids after a delay, or let them click next
            if (isCorrect) {
                setTimeout(() => {
                   if(ui.nextBtnContainer.classList.contains('hidden') === false) {
                       ui.nextBtn.click();
                   }
                }, 2000);
            }
        }

        // Attach Event Listeners to Choices
        ui.btn1.addEventListener('click', () => checkAnswer(ui.btn1));
        ui.btn2.addEventListener('click', () => checkAnswer(ui.btn2));

        ui.nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) {
                loadQuestion();
            } else {
                showCertificate();
            }
        });

        function showCertificate() {
            playCheerSound();
            screens.quiz.classList.remove('flex');
            screens.quiz.classList.add('hidden');
            screens.certificate.style.display = 'block';

            document.getElementById('cert-name').innerText = studentName;
            document.getElementById('final-score').innerText = score;
            
            const today = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('cert-date').innerText = "Date: " + today.toLocaleDateString('en-US', options);
        }

        // Allow 'Enter' key to start
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                startBtn.click();
            }
        });

    </script>
</body>
</html>
